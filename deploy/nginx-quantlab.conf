# Add these two blocks inside the existing `server { ... }` block for your domain
# (the one that already has HTTPS set up), then reload nginx.
# QuantLab must be running on the same machine: python -m quantlab serve --port 8000

location = /quantlab {
    return 301 /quantlab/;
}

location /quantlab/ {
    proxy_pass http://127.0.0.1:8000/;   # the trailing slash strips the /quantlab prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;             # assistant answers can take a while
}
