# Puts QuantLab on your own domain with automatic HTTPS (Caddy fetches the certificate).
# 1. Point your domain's DNS A record at this server.
# 2. Copy .env.example to .env and fill in QUANTLAB_DOMAIN and QUANTLAB_PASSWORD.
# 3. docker compose up -d --build
services:
  quantlab:
    build: .
    restart: unless-stopped
    environment:
      QUANTLAB_PASSWORD: ${QUANTLAB_PASSWORD:?Set QUANTLAB_PASSWORD in .env}
    volumes:
      - quantlab-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      QUANTLAB_DOMAIN: ${QUANTLAB_DOMAIN:?Set QUANTLAB_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  quantlab-data:
  caddy-data:
