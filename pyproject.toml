[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Personal quant research, signals and paper-trading platform for US and ASX stocks and options"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "yfinance>=0.2.60",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
quantlab = "quantlab.__main__:main"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.setuptools.package-data]
quantlab = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
